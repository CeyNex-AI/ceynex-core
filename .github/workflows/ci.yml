# ceynex-core CI: lint, the unit suite, and the integration suite against real
# Postgres, Neo4j and Qdrant.
#
# Needs no secrets, by design. Everything here must pass with no OPENAI_API_KEY
# and no TAVILY_API_KEY: degraded mode is a supported state (SRS 3.4.3), and a
# key in CI would re-hide the class of defect this exists to catch -- a test that
# passes only because a developer's .env supplied something. Never fix a red run
# by adding one.
#
# `ceynex` is a namespace package split across two distributions, so the test
# jobs check ceynex-contracts out beside this repo: the layout the Makefile's
# CONTRACTS_SPEC and the backend image (ceynex-infra/backend/Dockerfile) assume.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Parity with the Makefile: the Hub's xet transfer path has stalled model
  # downloads indefinitely; the plain HTTP path does not.
  HF_HUB_DISABLE_XET: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned to the version the tree is verified clean with. pyproject's
      # `ruff>=0.5` would float to whatever released last night and turn
      # unrelated PRs red. No `ruff format --check`: it would rewrite 123 files,
      # and a repo-wide reformat is a team decision, not a CI side effect.
      - run: pip install ruff==0.16.3
      - run: ruff check --output-format=github .

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the backend image and the local venvs run; 3.11 is the
        # floor pyproject declares (`typing.NotRequired`), checked so the
        # declaration stays true rather than aspirational.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: ceynex-core
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: CeyNex-AI/ceynex-contracts
          path: ceynex-contracts
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ceynex-core/pyproject.toml
      # The backend image's extras (`.[policy]`), plus dev.
      - name: Install
        run: |
          python -m pip install ./ceynex-contracts
          python -m pip install -e "./ceynex-core[dev,policy]"
      - name: Unit tests (what `make test-unit` runs)
        working-directory: ceynex-core
        env:
          # A tripwire: a unit test that reaches for a model download fails here
          # rather than quietly pulling hundreds of MB. Tests never hit the network.
          HF_HUB_OFFLINE: "1"
        run: python -m pytest -m "not integration" -rfE --durations=15 -o faulthandler_timeout=120

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ceynex
          POSTGRES_PASSWORD: ceynex_dev
          POSTGRES_DB: ceynex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ceynex -d ceynex"
          --health-interval 5s --health-timeout 5s --health-retries 12
      neo4j:
        # No APOC plugin: only the --flows and --apparel loaders call it, and no
        # test runs them. Add NEO4J_PLUGINS the day one does.
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ceynex_dev_pw
          NEO4J_server_memory_heap_max__size: 1G
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 30s
      qdrant:
        # A bash TCP probe: the image ships neither curl nor wget (see
        # docker-compose.yml, which learned this the hard way).
        image: qdrant/qdrant:v1.17.1
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 10s
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ceynex
      POSTGRES_PASSWORD: ceynex_dev
      POSTGRES_DB: ceynex
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ceynex_dev_pw
      QDRANT_URL: http://localhost:6333
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
    steps:
      - uses: actions/checkout@v7
        with:
          path: ceynex-core
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: CeyNex-AI/ceynex-contracts
          path: ceynex-contracts
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ceynex-core/pyproject.toml
      - name: Install
        run: |
          python -m pip install ./ceynex-contracts
          python -m pip install -e "./ceynex-core[dev,policy]"
      # The news-store round trips embed headlines, so this job needs the ONNX
      # models. A failed download does not error: `upsert` logs "could not
      # embed" and skips, and the test then fails on `count() == 1`.
      - uses: actions/cache@v6
        with:
          path: .fastembed
          key: fastembed-${{ hashFiles('ceynex-core/ceynex/retrieval/schema.py') }}
      - name: Apply schema.sql and seed dim_* (make db-init)
        working-directory: ceynex-core
        run: python -m ceynex.data.bootstrap
      - name: Apply schema.cypher and load TradeAgreement nodes
        working-directory: ceynex-core
        run: python -m ceynex.kg.load --schema --agreements
      - name: Integration tests
        working-directory: ceynex-core
        # Deselected, not skipped, and not this repo's owner's to change (M3's).
        # Both files assert EDB/JAAF evidence that only a stack loaded with that
        # data through `make ingest` holds -- data/raw/edb and data/raw/jaaf are
        # gitignored (data/raw/*/*), so no CI checkout ever has the source PDFs/
        # HTML to ingest from. Same failure on any developer stack that hasn't
        # run `make ingest` first; tests/kg/test_spotcheck.py's own module
        # docstring states this precondition.
        run: >-
          python -m pytest -m integration -rfE -o faulthandler_timeout=120
          --deselect tests/agents/test_apparel_manufacturing.py::test_partner_query_against_the_real_merged_graph_finds_data
          --deselect tests/kg/test_spotcheck.py::test_edb_apparel_reaches_the_graph_for_the_united_states
          --deselect tests/kg/test_spotcheck.py::test_edb_apparel_reaches_the_graph_for_the_united_kingdom
          --deselect tests/kg/test_spotcheck.py::test_jaaf_apparel_reaches_the_graph_for_the_united_states
          --deselect tests/kg/test_spotcheck.py::test_jaaf_apparel_reaches_the_graph_for_the_united_kingdom
          --deselect tests/kg/test_spotcheck.py::test_market_share_of_verified_apparel_partners_sums_to_one
          --deselect tests/kg/test_spotcheck.py::test_cagr_endpoints_match_the_verified_edb_figures
