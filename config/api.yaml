# API-surface decisions that a marker may ask us to justify, kept out of code
# so a diff shows who changed what (see ceynex/settings.py's module docstring).

# SRS 3.4.6 — rate limiting on POST /api/query, per signed-in user, or per
# client address for the anonymous callers the endpoint still answers.
rate_limit:
  enabled: true

  # 30/minute is one query every two seconds, sustained. Chosen against what a
  # real session looks like rather than against what the server can take: the
  # measured p95 for a cross-sector answer is 3.9 s (docs/EVALUATION.md), and a
  # person reading an evidence panel does not submit again inside that. A demo
  # clicking through the 30-question set as fast as it loads stays under it;
  # a script in a loop does not.
  query_per_minute: 30

  # The window the count resets on. Kept equal to the rate's own denominator —
  # a longer window with the same limit would allow the whole allowance to be
  # spent in one burst and then nothing for minutes.
  window_seconds: 60

# The news sidecar's own allowance (docs/ARCHITECTURE_DELTA.md D11). A separate
# block, and a separate identity namespace in routes/news.py, because the
# browser fires a news search on every submitted query — counting both against
# one allowance would halve the query limit above without anyone changing it.
#
# Lower than the query limit on purpose: a news search costs an outbound call
# on someone else's free API, which is a scarcer resource than our own CPU.
news_rate_limit:
  enabled: true
  search_per_minute: 20
  window_seconds: 60

# GET /api/graph/expand — clicking a node in the answer's knowledge graph. A
# third block and a third identity namespace, for the same reason news has its
# own: they share Redis keys otherwise, and exploring a graph would spend the
# allowance for asking questions.
graph_rate_limit:
  enabled: true

  # Higher than either of the above, because the unit is different. A query is a
  # question someone composed; an expansion is a click, and following a chain of
  # trading partners is four or five of them in the time one query takes to
  # answer. The cost matches: one bounded single-hop read, no LLM, no fan-out,
  # no outbound call on anyone else's API.
  expand_per_minute: 120
  window_seconds: 60

# POST /api/chat/stream — a turn in a conversation (docs/ARCHITECTURE_DELTA.md
# D13). A fourth block and a fourth identity namespace, for the same reason news
# and graph have their own: sharing Redis keys with the query allowance would
# mean a conversation silently spends someone's ability to ask a fresh question.
#
# Higher than query_per_minute, because the unit is smaller. A conversation is
# several short turns where a one-shot query is one long one, and most of those
# turns take the `discuss` path — no fan-out, no Cypher, no LLM beyond one cheap
# call. Turns that DO re-run the graph cost exactly what a query costs, which is
# why this is 45 and not 200: the ceiling still has to bound the expensive case.
chat_rate_limit:
  enabled: true
  turns_per_minute: 45
  window_seconds: 60

# General web search (docs/ARCHITECTURE_DELTA.md D14). Deliberately NOT a
# per-user allowance like the four blocks above, and that difference is the whole
# point of it existing: the per-user limits already bound how often any one
# account can trigger a search, but they say nothing about the total. A hundred
# accounts inside their own limits still add up to a bill on somebody else's API.
#
# So the identity here is a single fixed key shared by every caller and, through
# Redis, by both uvicorn workers — a global ceiling on outbound calls per minute
# rather than a fairness rule. Without REDIS_URL it degrades to per-process,
# which is the same caveat rate_limit.py already documents for everything else.
#
# Sized against the recency gate: `wants_current_context()` means only a
# minority of questions are eligible at all, so this bounds the tail rather than
# the common case.
websearch_rate_limit:
  enabled: true
  searches_per_minute: 60
  window_seconds: 60
