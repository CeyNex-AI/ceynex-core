# LLM configuration for LLMReasoningClient and the orchestrator's router.
#
# Model IDs live here, not in code, so cost can be traded against quality without
# a code change — the mitigation for R5 (LLM quota/cost exhaustion mid-sprint).
# Verify the exact IDs against the provider's current model list before the demo;
# they change more often than this file does.

provider: openai

models:
  # Routing is a short classification with a fixed output schema. It runs on
  # every single query, so it takes the cheapest model that can hold the schema.
  #
  # cost_per_1k_*_tokens feed the daily_spend_cap_usd check below. Verify
  # them against the provider's current price list before the demo, same as
  # the model ids.
  router:
    model: gpt-4o-mini
    temperature: 0.0
    max_tokens: 300
    cost_per_1k_input_tokens: 0.00015
    cost_per_1k_output_tokens: 0.0006

  # Merging several agents' findings into one coherent answer is the hardest
  # generation in the system (SRS 3.1.2 forbids concatenation), so it gets the
  # stronger model.
  merge:
    model: gpt-4o
    temperature: 0.2
    max_tokens: 1200
    cost_per_1k_input_tokens: 0.0025
    cost_per_1k_output_tokens: 0.01

  # Per-agent explanation of its own figures.
  explanation:
    model: gpt-4o-mini
    temperature: 0.2
    max_tokens: 600
    cost_per_1k_input_tokens: 0.00015
    cost_per_1k_output_tokens: 0.0006

limits:
  request_timeout_s: 8.0     # below the 10s single-sector budget in SRS 3.4.1
  max_retries: 1             # one retry, then degrade — retries eat the budget
  # R5 (LLM quota/cost exhaustion): once LLMReasoningClient.usage.cost_usd
  # crosses this for the process's lifetime, every further generate() call
  # degrades (SRS 3.4.3) instead of spending more. Resets on process restart,
  # same as the rest of `usage` — see LLMReasoningClient docstring.
  daily_spend_cap_usd: 5.0

cache:
  # Prompt-hash cache. Required from Day 6 (R5) and it is also what makes the
  # demo fast and repeatable.
  enabled: true
  path: .cache/llm
  ttl_hours: 168

# Failsafe provider (R5): tried once, after the primary provider's retries are
# exhausted (or skipped — no OPENAI_API_KEY, or daily_spend_cap_usd already
# hit), and before generate() gives up and degrades. OpenRouter speaks the
# OpenAI API, so the same client code drives both providers; only base_url and
# the API key differ. Costs nothing against daily_spend_cap_usd because these
# are OpenRouter's free-tier models — verify the exact ids are still live at
# https://openrouter.ai/models before the demo, they rotate.
#
# Each role lists models most-preferred first. OpenRouter's free tier is
# rate-limited (~20 req/min per model) and the exact free-tier catalog
# changes often, so a single model here is a single point of failure — the
# list is sent as OpenRouter's own model-routing array (`extra_body.models`
# in client.py), and OpenRouter itself falls through to the next entry on a
# rate limit or outage without us needing a second local retry loop. Spread
# entries across different vendors (not just Llama variants) so one vendor's
# rate limit doesn't take out the whole list.
fallback:
  enabled: true
  base_url: https://openrouter.ai/api/v1
  timeout_s: 6.0    # short, but a bit more than the single-model case — OpenRouter may cascade through several entries within this one call
  models:
    router:
      - meta-llama/llama-3.3-70b-instruct:free
      - google/gemma-2-9b-it:free
      - mistralai/mistral-7b-instruct:free
    merge:
      - deepseek/deepseek-chat:free
      - qwen/qwen-2.5-72b-instruct:free
      - meta-llama/llama-3.3-70b-instruct:free
    explanation:
      - meta-llama/llama-3.3-70b-instruct:free
      - google/gemma-2-9b-it:free
      - mistralai/mistral-7b-instruct:free
