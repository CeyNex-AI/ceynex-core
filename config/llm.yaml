# LLM configuration for LLMReasoningClient and the orchestrator's router.
#
# Model IDs live here, not in code, so cost can be traded against quality without
# a code change — the mitigation for R5 (LLM quota/cost exhaustion mid-sprint).
# Verify the exact IDs against the provider's current model list before the demo;
# they change more often than this file does.

provider: openai

models:
  # Routing is a short classification with a fixed output schema. It runs on
  # every single query, so it takes the cheapest model that can hold the schema.
  #
  # cost_per_1k_*_tokens feed the daily_spend_cap_usd check below. Verify
  # them against the provider's current price list before the demo, same as
  # the model ids.
  router:
    model: gpt-4o-mini
    temperature: 0.0
    max_tokens: 300
    cost_per_1k_input_tokens: 0.00015
    cost_per_1k_output_tokens: 0.0006

  # Merging several agents' findings into one coherent answer is the hardest
  # generation in the system (SRS 3.1.2 forbids concatenation), so it gets the
  # stronger model.
  merge:
    model: gpt-4o
    temperature: 0.2
    max_tokens: 1200
    cost_per_1k_input_tokens: 0.0025
    cost_per_1k_output_tokens: 0.01

  # Per-agent explanation of its own figures.
  explanation:
    model: gpt-4o-mini
    temperature: 0.2
    max_tokens: 600
    cost_per_1k_input_tokens: 0.00015
    cost_per_1k_output_tokens: 0.0006

  # --- the conversational layer ----------------------------------------
  #
  # Every one of these is on the cheap model deliberately. They run per *turn*
  # rather than per query, so a conversation multiplies them in a way the
  # original three roles never were: putting any of them on gpt-4o would make
  # chat cost several times what a single query costs today, against a
  # daily_spend_cap_usd of 5.00.
  #
  # They are separate roles rather than reusing `router` so the per-role cost
  # breakdown in the usage ledger can tell them apart — routing spend and
  # turn-classification spend answer different questions.

  # The 3-6 step plan shown before the fan-out starts. Degrades to a plan
  # derived deterministically from the RouteDecision when no key is present, so
  # the reasoning display still works in degraded mode (SRS 3.4.3).
  planner:
    model: gpt-4o-mini
    temperature: 0.0
    max_tokens: 300
    cost_per_1k_input_tokens: 0.00015
    cost_per_1k_output_tokens: 0.0006

  # Phrases the clarifying questions when the deterministic gate fires, and may
  # veto the gate if the phrasing already resolves the ambiguity. Never the
  # thing that *decides* to ask -- that is free and deterministic.
  clarifier:
    model: gpt-4o-mini
    temperature: 0.0
    max_tokens: 400
    cost_per_1k_input_tokens: 0.00015
    cost_per_1k_output_tokens: 0.0006

  # "discuss" vs "reanalyse" for a follow-up. The single most cost-relevant
  # decision in the chat feature: it is what keeps most follow-ups off the
  # five-agent fan-out entirely.
  turn_classify:
    model: gpt-4o-mini
    temperature: 0.0
    max_tokens: 200
    cost_per_1k_input_tokens: 0.00015
    cost_per_1k_output_tokens: 0.0006

  # Answers a follow-up from the evidence already on screen, without re-running
  # the graph. Slightly more headroom than the others because it is the only one
  # of these whose output the user reads as prose.
  chat:
    model: gpt-4o-mini
    temperature: 0.3
    max_tokens: 800
    cost_per_1k_input_tokens: 0.00015
    cost_per_1k_output_tokens: 0.0006

  # Rewrites a context-dependent follow-up into a standalone query.
  condense:
    model: gpt-4o-mini
    temperature: 0.0
    max_tokens: 200
    cost_per_1k_input_tokens: 0.00015
    cost_per_1k_output_tokens: 0.0006

  # Names a conversation from its first exchange. Falls back to a truncated
  # first question, so a missing key costs a nice title and nothing else.
  title:
    model: gpt-4o-mini
    temperature: 0.3
    max_tokens: 40
    cost_per_1k_input_tokens: 0.00015
    cost_per_1k_output_tokens: 0.0006

limits:
  request_timeout_s: 8.0     # below the 10s single-sector budget in SRS 3.4.1
  max_retries: 1             # one retry, then degrade — retries eat the budget
  # R5 (LLM quota/cost exhaustion): once today's spend reaches this, every further
  # paid call degrades (SRS 3.4.3) instead of spending more — the free failsafe is
  # still tried first. Counted per UTC day in ceynex/observability/spend.py, and
  # shared by both uvicorn workers through Redis when REDIS_URL is set (D16);
  # without Redis each worker counts only its own, and /api/usage/limits says so.
  daily_spend_cap_usd: 5.0
  # One reader's share of the day (D16). A single account is the likeliest way to
  # run up a bill, and the deployment cap alone lets one reader spend all of it.
  # 1.00 is roughly a hundred gpt-4o merges — a long working day of analysis, far
  # past a demo. Past it that reader's answers carry figures and evidence without
  # model-written prose until 00:00 UTC; everyone else is unaffected. 0 disables.
  per_user_daily_cap_usd: 1.0

cache:
  # Prompt-hash cache. Required from Day 6 (R5) and it is also what makes the
  # demo fast and repeatable.
  enabled: true
  path: .cache/llm
  ttl_hours: 168

# Failsafe provider (R5): tried once, after the primary provider's retries are
# exhausted (or skipped — no OPENAI_API_KEY, or daily_spend_cap_usd already
# hit), and before generate() gives up and degrades. OpenRouter speaks the
# OpenAI API, so the same client code drives both providers; only base_url and
# the API key differ. Costs nothing against daily_spend_cap_usd — free tier.
#
# The model id is OpenRouter's own Free Models Router (openrouter/free, see
# https://openrouter.ai/docs/guides/routing/routers/free-router), not one
# specific free model: it picks at random from OpenRouter's live free-tier
# catalog and filters for whatever the request needs (structured outputs,
# for the router role's json_mode). That catalog "changes frequently" per
# OpenRouter's own docs, which is exactly why pinning a specific free model
# id here would go stale — openrouter/free is OpenRouter's answer to that,
# so there is nothing to verify or rotate on our side before the demo.
fallback:
  enabled: true
  base_url: https://openrouter.ai/api/v1
  # Verified live 2026-08-27: a warm connection answers in 2-4s, but a cold
  # process (fresh TLS handshake) burned the full 6s just on setup and timed
  # out before the free model even started generating. 10s gives that cold
  # first call room without meaningfully changing the accepted worst case —
  # this only runs after the primary's own budget (up to request_timeout_s *
  # (max_retries + 1)) is already spent, so it was never inside SRS 3.4.1's
  # 10s single-sector budget to begin with.
  timeout_s: 10.0
  models:
    router: openrouter/free
    merge: openrouter/free
    explanation: openrouter/free
