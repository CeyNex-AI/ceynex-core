[project]
name = "ceynex"
version = "0.1.0"
description = "CeyNex — a multi-agent decision intelligence platform for Sri Lanka's national export economy"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "openai>=1.40",
    "neo4j>=5.20",
    "psycopg[binary]>=3.1",
    "asyncpg>=0.29",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "httpx>=0.27",
    "tenacity>=8.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typing-extensions>=4.12",
    "statsmodels>=0.14",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ceynex*", "eval*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires docker services (deselect with '-m \"not integration\"')",
]
