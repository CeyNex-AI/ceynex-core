[project]
name = "ceynex"
version = "0.1.0"
description = "CeyNex — a multi-agent decision intelligence platform for Sri Lanka's national export economy"
requires-python = ">=3.11"
dependencies = [
    # ceynex-contracts is deliberately NOT listed here. It is not on PyPI, and a
    # bare name would make `pip install -e .` fail while a git+ssh URL would make
    # it fail for anyone without a deploy key. `make install` installs it from the
    # sibling checkout; see CONTRACTS_SPEC in the Makefile to point at a git ref
    # instead. tests/test_layout.py fails loudly if it is missing.
    # Upper bound is load-bearing, not caution. `ceynex/observability/context.py`
    # depends on LangGraph copying the caller's contextvars into each parallel
    # node task — true in 1.2 via `pregel/_executor.py`, but those are private
    # modules, not a documented guarantee. Without it the live reasoning trace
    # goes silently empty rather than failing loudly.
    # `tests/observability/test_context_propagation.py` is the canary; run it
    # before widening this pin.
    "langgraph>=1.2,<1.3",
    "openai>=1.40",
    # Transitive via openai (which allows httpx2<3,>=2.7.0). Pinned forward
    # because 2.10.0 carries PYSEC-2026-3846/3848/3849 (request-smuggling via a
    # duplicated Content-Length, header injection through per-file multipart
    # headers, and a decompression flaw); 2.12.0 fixes all three and stays inside
    # openai's range. Surfaced by `pip-audit` in the security workflow; drop this
    # pin once openai's own floor moves past it. SRS 3.1.11.
    "httpx2>=2.12.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "neo4j>=5.20",
    "psycopg[binary]>=3.1",
    "asyncpg>=0.29",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "httpx>=0.27",
    "tenacity>=8.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typing-extensions>=4.12",
    "statsmodels>=0.14",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    # SRS 3.4.6's rate-limit counter, shared across the deployed image's two
    # uvicorn workers. Optional at runtime — no REDIS_URL falls back to a
    # per-process window (ceynex/api/rate_limit.py) — but declared so the
    # backend image, which does set it, is never built without the client.
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
    # SAST and dependency-vulnerability scanning, run in the security workflow
    # and available locally through `make security`.
    "bandit>=1.9",
    "pip-audit>=2.10",
]
# Policy-document retrieval (D10). Deliberately optional, and deliberately NOT
# sentence-transformers: that pulls torch, and this package is installed by all
# three members, so its dependency list is a tax on everyone (the same rule
# ceynex-contracts states for its own). `qdrant-client[fastembed]` is ONNX and
# about 200 MB against torch's 2+ GB, and it serves the dense model, the BM25
# sparse model and the cross-encoder reranker from one dependency.
#
# The backend image installs `.[policy]`. Anyone who does not need retrieval
# does not install it, and the agent degrades to its pre-retrieval behaviour
# when the import fails — same posture as an absent OPENAI_API_KEY.
policy = [
    "qdrant-client[fastembed]>=1.11",
]
eda = [
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "jinja2>=3.1",
]
# `make docs` converts the governing .docx/.xlsx/.pdf documents to greppable
# text. Declared here rather than assumed present: without them the target fails
# on a clean checkout, which is exactly where someone new runs it first.
docs = [
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# `ceynex` is an implicit namespace package shared with the ceynex-contracts
# distribution, which supplies ceynex.contracts. Neither repo ships a
# ceynex/__init__.py — adding one back shadows the other and breaks every
# teammate's imports. tests/test_layout.py guards this.
[tool.setuptools.packages.find]
include = ["ceynex*", "eval*"]
exclude = ["ceynex.contracts*"]
namespaces = true

# Data files the code reads at runtime. Without this they exist in a source
# checkout and vanish once installed, so everything passes locally and the
# container dies on startup. tests/test_layout.py asserts each one is reachable
# through importlib.resources rather than through a source-relative path.
[tool.setuptools.package-data]
"ceynex.data" = ["reference/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# ceynex.contracts arrives from a separate installed distribution, so isort would
# otherwise file it under third-party while ceynex.orchestrator stays first-party
# — the same top-level package split across two import groups. Nobody reading the
# code cares which wheel a module came from.
known-first-party = ["ceynex", "eval"]

# bandit SAST. Scans the shipped package only (tests seed fixtures and assert,
# which bandit reads as B101/B105 noise). It runs against a committed baseline
# (bandit-baseline.json) so the security workflow fails on a NEW finding rather
# than the current set, every one of which was triaged on 2026-09-19 as either a
# false positive or an accepted, documented risk:
#   - B608 (23): SQL is assembled from code-authored fragments; every value is
#     bound as a %s / %(name)s parameter and every interpolated identifier is a
#     fixed module constant (_COLS) or allowlist member (reader.py's
#     MEASURED_TARGETS). Confirmed a "'; DROP TABLE fact_trade; --" query leaves
#     the row count untouched.
#   - B301 (1): pickle.loads in models/registry.py reads only artifacts the
#     registry itself wrote; annotated inline with a nosec and reasoning.
#   - B105 (2): "hardcoded password" matches on config-dict string values in
#     models/shocks.py (e.g. "fx_pass_through": "sector"), not credentials.
#   - B603/B607/B404 (5): a fixed-argument `git rev-parse HEAD` for provenance,
#     no shell and no user input.
#   - B311/B112/B101 (4): non-crypto randomness, a style nit, an eval-helper
#     assert.
# Regenerate the baseline deliberately, never to paper over a real finding:
#   bandit -r ceynex -f json -o bandit-baseline.json
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires docker services (deselect with '-m \"not integration\"')",
]
