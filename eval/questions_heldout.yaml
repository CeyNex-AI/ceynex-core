# CeyNex HELD-OUT evaluation set: 70 questions, written 2026-10-05.
#
# PURPOSE. The 30-question set in `questions.yaml` is the pre-registered
# baseline, and the paper calls it small. This file is a second, held-out set
# used as a replication: the same four conditions (eval/baseline.py), the same
# claim check (eval/claims.py), reported next to the 30 rather than merged into
# them, so the original baseline stays comparable across runs.
#
# PRE-REGISTRATION. This file is committed on its own, BEFORE any of these
# questions has been asked of any condition, for the reason `questions.yaml`
# was: questions written after watching the system answer them describe it
# instead of testing it. The git history is the evidence. Labels below
# (`expected_route`, `answerable`) are the correct behaviour as judged when
# writing, not the current router's behaviour. Where the system later disagrees,
# do not edit the label; record the disagreement.
#
# DISCLOSURE. The author had seen system answers to the ORIGINAL 30 questions
# while writing these, but none to these 70. No question here is a paraphrase of
# one of the 30.
#
# Composition: 28 single-sector · 27 cross-sector · 15 simulation.
#   18 of the 70 are unanswerable (6 single, 6 cross, 6 simulation), where the
#   correct behaviour is to say so. With the original 30 that gives 21
#   unanswerable questions in all, against 3 before.
#
# Unanswerable means the project's dataset cannot answer it: a year that has
# not happened, a sector CeyNex does not cover (gems, tourism, fisheries,
# software, tea machinery), or a granularity the data does not hold (district,
# firm, monthly, employment by factory).
#
# Route conventions follow questions.yaml: a trade-flow question on one sector
# routes to export_analytics; a forecast to forecast; a price or production
# question to the sector agent; a cross-sector comparison to export_analytics
# plus both sector agents; a shock to trade_economics plus the sector agent(s).

