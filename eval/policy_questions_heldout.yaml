# CeyNex HELD-OUT policy-retrieval set: 25 questions (P16-P40), written 2026-10-05.
#
# Extends the 15 questions in `policy_questions.yaml` to 40, so the retrieval
# on/off comparison (EVALUATION.md §7; `make eval-policy-baseline` vs
# `make eval-policy`) rests on more than 12 answerable questions. Kept in its own
# file so the original 15 remain comparable; report the 25 and the pooled 40.
#
# PRE-REGISTRATION. Committed on its own BEFORE any of these questions was asked
# of the system, with retrieval on or off. Labels are the correct behaviour as
# judged when writing. Where the system disagrees, record it; do not edit labels.
#
# DISCLOSURE. The author knew which documents are in the index (the manifest in
# ceynex/data/reference/policy_documents.csv: LKA, GBR, CAN, USA, IND, ITA) and
# had seen the 2026-08-28 results for P01-P15, but no answer to these 25.
# Questions are spread across the six indexed countries on purpose; five
# (marked) target a country that is NOT indexed or a fact no document holds, so
# the correct behaviour is to say the documents do not cover it.
#
# Composition: 10 single-sector · 7 cross-sector · 8 simulation.
#   5 of the 25 are unanswerable. Categories are the existing three on purpose
#   (see the header of policy_questions.yaml for why).

questions:

  # --- single-sector -----------------------------------------------------

  - id: P16
    category: single_sector
    question: What does Sri Lanka's National Export Strategy say about developing the spices sector?
    expected_route: [trade_economics, agriculture_commodity]
    expected_sectors: [agriculture, macro]
    answerable: true

