# CeyNex local development stack.
#
# Per ARCHITECTURE_DELTA (R8): Neo4j Community 5.x serves a single user database,
# so each team member runs their own stack on their own ports rather than sharing
# one instance with per-member database names. Override the *_PORT vars in .env.
services:
  postgres:
    image: postgres:18
    container_name: ceynex-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ceynex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ceynex_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ceynex}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18 places its data in a version-named subdirectory and wants the
      # mount here, not at /var/lib/postgresql/data. Mounting the inner path is
      # what crash-looped the deployed database VM.
      - postgres_data:/var/lib/postgresql
    # No initdb mount: the schema lives in the ceynex-contracts package and is
    # applied by `make db-init`, so the same code path serves this stack and the
    # deployed VM (whose compose has no initdb hook at all).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ceynex} -d ${POSTGRES_DB:-ceynex}"]
      interval: 5s
      timeout: 5s
      retries: 12

  neo4j:
    image: neo4j:5.26-community
    container_name: ceynex-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-ceynex_dev_pw}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Policy-document vector store (deviation D10). Holds chunked trade-policy text
  # for Sri Lanka's top 10 export destinations, keyed to the Neo4j entities each
  # chunk is about so retrieval is filtered by the graph rather than run blind.
  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: ceynex-qdrant
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # A bash TCP probe, not `curl`/`wget` and not the qdrant binary. The image
      # ships bash but neither curl nor wget (checked against v1.17.1), and the
      # binary has no health subcommand — `--help` lists none. Both of the
      # obvious probes therefore fail with "executable file not found", which
      # docker reports as unhealthy, so `make up` would wait forever on a
      # service that is actually running.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  adminer:
    image: adminer:4
    container_name: ceynex-adminer
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
